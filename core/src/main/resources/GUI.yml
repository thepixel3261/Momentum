    material: "DEFAULT" # DEFAULT = Player Head with texture
    name: "&6Page up"
    lore:
      - ""
  down:
    material: "DEFAULT" # DEFAULT = Player Head with texture
    name: "&6Page Down"
    lore:
      - ""
claim_all_item:
  material: "CHEST"
  name: "&bClaim All Rewards"
  lore:
